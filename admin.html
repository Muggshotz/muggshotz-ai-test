<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MuggsHotz Admin — Token Tool</title>
<style>
  :root {
    --orange: #CC5500;
    --dark: #1a1a1a;
    --darker: #0e0e0e;
    --card: #242424;
    --text: #f0f0f0;
    --muted: #999;
    --success: #4caf50;
    --danger: #d9534f;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--darker);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
    margin: 0;
    padding: 24px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 {
    color: var(--orange);
    font-size: 1.5rem;
    margin-bottom: 4px;
  }
  .subtitle { color: var(--muted); margin-bottom: 24px; font-size: 0.9rem; }
  .card {
    background: var(--card);
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 20px;
    border: 1px solid #333;
  }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 0.85rem;
    color: var(--muted);
  }
  input {
    width: 100%;
    padding: 10px 12px;
    margin-bottom: 16px;
    border-radius: 8px;
    border: 1px solid #444;
    background: var(--dark);
    color: var(--text);
    font-size: 1rem;
  }
  input:focus { outline: 2px solid var(--orange); border-color: var(--orange); }
  .btn-row { display: flex; gap: 12px; }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  #grantBtn { background: var(--success); color: white; }
  #grantBtn:hover { background: #43a047; }
  #deductBtn { background: var(--danger); color: white; }
  #deductBtn:hover { background: #c9302c; }
  #unlockBtn { background: var(--orange); color: white; width: 100%; }
  #unlockBtn:hover { background: #b34a00; }
  #status {
    margin-top: 14px;
    padding: 12px;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
  }
  #status.success { background: rgba(76,175,80,0.15); border: 1px solid var(--success); display: block; }
  #status.error { background: rgba(217,83,79,0.15); border: 1px solid var(--danger); display: block; }
  #toolSection { display: none; }
  .log-entry {
    padding: 10px 0;
    border-bottom: 1px solid #333;
    font-size: 0.85rem;
  }
  .log-entry:last-child { border-bottom: none; }
  .log-amount-positive { color: var(--success); font-weight: 600; }
  .log-amount-negative { color: var(--danger); font-weight: 600; }
  .log-meta { color: var(--muted); font-size: 0.75rem; margin-top: 2px; }
  #logList { max-height: 320px; overflow-y: auto; }
  .empty-log { color: var(--muted); font-size: 0.85rem; text-align: center; padding: 12px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MuggsHotz Admin</h1>
  <div class="subtitle">Token grant &amp; deduct tool</div>

  <div class="card" id="lockSection">
    <label for="passwordInput">Admin Password</label>
    <input type="password" id="passwordInput" placeholder="Enter admin password" autocomplete="off">
    <button id="unlockBtn">Unlock</button>
  </div>

  <div id="toolSection">
    <div class="card">
      <label for="emailInput">Customer Email</label>
      <input type="email" id="emailInput" placeholder="customer@example.com">

      <label for="amountInput">Number of Spins</label>
      <input type="number" id="amountInput" min="1" step="1" placeholder="e.g. 3">

      <label for="reasonInput">Reason (required)</label>
      <input type="text" id="reasonInput" placeholder="e.g. gift from another customer, goodwill, correction">

      <div class="btn-row">
        <button id="grantBtn">Grant Tokens</button>
        <button id="deductBtn">Deduct Tokens</button>
      </div>

      <div id="status"></div>
    </div>

    <div class="card">
      <label style="margin-bottom:10px;">Recent Grants This Session</label>
      <div id="logList">
        <div class="empty-log">No grants yet this session.</div>
      </div>
    </div>
  </div>
</div>

<script>
let adminPassword = "";

const lockSection = document.getElementById("lockSection");
const toolSection = document.getElementById("toolSection");
const passwordInput = document.getElementById("passwordInput");
const unlockBtn = document.getElementById("unlockBtn");
const emailInput = document.getElementById("emailInput");
const amountInput = document.getElementById("amountInput");
const reasonInput = document.getElementById("reasonInput");
const grantBtn = document.getElementById("grantBtn");
const deductBtn = document.getElementById("deductBtn");
const statusBox = document.getElementById("status");
const logList = document.getElementById("logList");

// "Unlock" doesn't call the server — it just stores the password locally
// in this page's memory so it can be sent along with every grant/deduct
// request. The real check always happens server-side in admin-grant.js;
// this is just a convenience so you don't retype the password every time.
unlockBtn.addEventListener("click", () => {
  const pw = passwordInput.value.trim();
  if (!pw) return;
  adminPassword = pw;
  lockSection.style.display = "none";
  toolSection.style.display = "block";
});

passwordInput.addEventListener("keydown", (e) => {
  if (e.key === "Enter") unlockBtn.click();
});

function showStatus(message, isError) {
  statusBox.textContent = message;
  statusBox.className = isError ? "error" : "success";
}

function addLogEntry(email, amount, reason, newBalance) {
  const emptyMsg = logList.querySelector(".empty-log");
  if (emptyMsg) emptyMsg.remove();

  const entry = document.createElement("div");
  entry.className = "log-entry";
  const sign = amount > 0 ? "+" : "";
  const cls = amount > 0 ? "log-amount-positive" : "log-amount-negative";
  entry.innerHTML = `
    <span class="${cls}">${sign}${amount}</span> spins — ${email}
    <div class="log-meta">${reason} · new balance: ${newBalance} · ${new Date().toLocaleTimeString()}</div>
  `;
  logList.prepend(entry);
}

async function submitAction(action) {
  const customerEmail = emailInput.value.trim();
  const amount = amountInput.value.trim();
  const reason = reasonInput.value.trim();

  if (!customerEmail || !amount || !reason) {
    showStatus("Please fill in email, amount, and reason before submitting.", true);
    return;
  }

  grantBtn.disabled = true;
  deductBtn.disabled = true;

  try {
    const response = await fetch("/api/admin-grant", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        password: adminPassword,
        customerEmail,
        amount,
        action,
        reason,
        actingAdminEmail: "" // reserved for future multi-admin login support
      })
    });

    const data = await response.json();

    if (!response.ok) {
      showStatus(data.error || "Something went wrong.", true);
      return;
    }

    const verb = action === "grant" ? "Granted" : "Deducted";
    showStatus(`${verb} ${amount} spins for ${customerEmail}. New balance: ${data.newBalance}`, false);
    addLogEntry(customerEmail, data.change, reason, data.newBalance);

    // Clear the form for the next entry, but leave the email in place
    // in case you're about to do a related action for the same customer.
    amountInput.value = "";
    reasonInput.value = "";
  } catch (err) {
    showStatus("Network error: " + err.message, true);
  } finally {
    grantBtn.disabled = false;
    deductBtn.disabled = false;
  }
}

grantBtn.addEventListener("click", () => submitAction("grant"));
deductBtn.addEventListener("click", () => submitAction("deduct"));
</script>
</body>
</html>
