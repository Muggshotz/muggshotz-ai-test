<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MuggsHotz — Check Your Balance</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;font-family:system-ui,sans-serif;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:#1a1a1a;border:.5px solid #333;border-radius:12px;padding:2rem;width:100%;max-width:420px}
h1{font-size:22px;font-weight:700;color:#ff6a00;margin-bottom:.25rem;text-align:center}
.sub{font-size:12px;color:#666;margin-bottom:2rem;letter-spacing:1px;text-transform:uppercase;text-align:center}
label{font-size:12px;color:#888;display:block;margin-bottom:.4rem;text-transform:uppercase;letter-spacing:.5px}
input{width:100%;background:#0d0d0d;border:1px solid #444;border-radius:8px;padding:12px 14px;color:#fff;font-size:16px;text-transform:uppercase;text-align:center;letter-spacing:1px}
input:focus{outline:none;border-color:#ff6a00}
button{width:100%;background:#ff6a00;border:none;border-radius:8px;padding:.9rem;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:1rem;letter-spacing:.5px}
button:disabled{background:#333;color:#666;cursor:not-allowed}
.upgrade-btn{background:#22a845}
.upgrade-btn:hover{background:#1a8a38}
.result{margin-top:1.5rem;padding:1.25rem;border-radius:10px;text-align:center;display:none}
.result.show{display:block}
.result.found{background:#0d2a12;border:1px solid #22a845}
.result.notfound{background:#2a1a0d;border:1px solid #b87333}
.result.error{background:#2a0d0d;border:1px solid #c0392b}
.balance-amount{font-size:32px;font-weight:800;color:#5ddb7a;margin:.5rem 0}
.balance-label{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:1px}
.tier-badge{display:inline-block;background:#0d0d0d;border:1px solid #ff6a00;border-radius:20px;padding:.3rem .9rem;font-size:12px;color:#ff6a00;font-weight:700;letter-spacing:.5px;margin-top:.75rem}
.matured-note{font-size:12px;color:#5ddb7a;margin-top:.75rem;font-weight:600}
.note{font-size:12px;color:#666;margin-top:1.5rem;line-height:1.5;text-align:center}
</style>
</head>
<body>

<div class="card">
  <h1>🎟️ Check Your Balance</h1>
  <div class="sub">Flyer / Referral Code Lookup</div>

  <label>Your Code</label>
  <input type="text" id="codeInput" placeholder="e.g. CHIPPER-07" onkeydown="if(event.key==='Enter')checkBalance()"/>
  <button id="checkBtn" onclick="checkBalance()">Check Balance</button>

  <div class="result" id="result">
    <div class="balance-label" id="resultLabel"></div>
    <div class="balance-amount" id="resultAmount"></div>
    <div id="resultNote" style="font-size:13px;color:#ccc"></div>
    <div id="tierBadge" style="display:none"></div>
    <div id="maturedNote" style="display:none"></div>
    <button id="upgradeBtn" class="upgrade-btn" style="display:none" onclick="startUpgrade()"></button>
  </div>

  <div class="note">Enter the exact code from your flyer to see your current running balance. No login needed. Balances update automatically as sales come in — check back anytime.</div>
</div>

<script>
let lastLookup = null;

async function checkBalance(){
  const input = document.getElementById('codeInput');
  const btn = document.getElementById('checkBtn');
  const result = document.getElementById('result');
  const label = document.getElementById('resultLabel');
  const amount = document.getElementById('resultAmount');
  const note = document.getElementById('resultNote');
  const tierBadge = document.getElementById('tierBadge');
  const maturedNote = document.getElementById('maturedNote');
  const upgradeBtn = document.getElementById('upgradeBtn');

  const code = input.value.trim().toUpperCase();
  input.value = code;

  tierBadge.style.display = 'none';
  maturedNote.style.display = 'none';
  upgradeBtn.style.display = 'none';

  if(!code){
    result.className = 'result show error';
    label.textContent = '';
    amount.textContent = '';
    note.textContent = 'Please enter your code first.';
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Checking...';
  result.className = 'result show';
  label.textContent = '';
  amount.textContent = '...';
  note.textContent = '';

  try {
    const resp = await fetch('/api/get-balance?referralCode=' + encodeURIComponent(code));
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Could not check that code.');

    lastLookup = data;

    if (data.found) {
      result.className = 'result show found';
      label.textContent = (data.fullName ? data.fullName + ' — ' : '') + data.baseCode;
      amount.textContent = '$' + data.totalBalance.toFixed(2);
      note.textContent = 'This is your total balance across every one of your flyer codes. Ready for a payout? Just text or email Alyx with your code and the amount.';

      tierBadge.textContent = data.currentTier + ' Tier';
      tierBadge.style.display = 'inline-block';

      if (data.canUpgrade) {
        maturedNote.textContent = '🎉 Your ' + data.currentTier + ' tier is fully matured!';
        maturedNote.style.display = 'block';
        upgradeBtn.textContent = 'Upgrade to ' + data.nextTier;
        upgradeBtn.style.display = 'block';
      } else if (data.tierFullyMatured && !data.nextTier) {
        maturedNote.textContent = '🏆 You\'ve completed the top tier!';
        maturedNote.style.display = 'block';
      }
    } else {
      result.className = 'result show notfound';
      label.textContent = data.code;
      amount.textContent = '$0.00';
      note.textContent = 'We couldn\'t find that code. Double-check it matches your flyer exactly.';
    }
  } catch (err) {
    result.className = 'result show error';
    label.textContent = '';
    amount.textContent = '';
    note.textContent = err.message;
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check Balance';
  }
}

async function startUpgrade(){
  if (!lastLookup || !lastLookup.betaId) return;
  const upgradeBtn = document.getElementById('upgradeBtn');
  upgradeBtn.disabled = true;
  upgradeBtn.textContent = 'Setting up checkout...';

  try {
    const resp = await fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: 'tier_upgrade', betaId: lastLookup.betaId })
    });
    const data = await resp.json();
    if (!resp.ok) throw new Error(data.error || 'Could not start the upgrade checkout.');
    window.location.href = data.url;
  } catch (err) {
    upgradeBtn.disabled = false;
    upgradeBtn.textContent = 'Upgrade to ' + lastLookup.nextTier;
    alert('Could not start upgrade: ' + err.message);
  }
}
</script>
</body>
</html>
