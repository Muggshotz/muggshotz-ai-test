<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1800" width="100%" height="100%"
     preserveAspectRatio="xMidYMid meet"
     role="img" aria-label="Firsthand experience is the strongest evidence you will ever have, and the weakest evidence you can ever share.">

  <!-- Paper -->
  <rect width="1200" height="1800" fill="#F2EEE6"/>
  <rect x="64" y="64" width="1072" height="1672" fill="none" stroke="#16130F" stroke-width="2" opacity="0.22"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif" text-anchor="middle" fill="#16130F">

    <text x="600" y="505" font-size="54" font-style="italic" opacity="0.72">Firsthand experience is the</text>

    <!-- Full ink -->
    <text x="600" y="685" font-size="158" letter-spacing="8">STRONGEST</text>

    <text x="600" y="790" font-size="54" opacity="0.72">evidence you will ever have,</text>

    <!-- The turn -->
    <line x1="392" y1="891" x2="512" y2="891" stroke="#9A3B26" stroke-width="2"/>
    <text x="600" y="905" font-size="46" font-style="italic" opacity="0.58">and the</text>
    <line x1="688" y1="891" x2="808" y2="891" stroke="#9A3B26" stroke-width="2"/>

    <!-- Outline only: the weaker word carries less ink -->
    <text x="600" y="1080" font-size="158" letter-spacing="8" fill="none" stroke="#16130F" stroke-width="2.5">WEAKEST</text>

    <text x="600" y="1185" font-size="54" opacity="0.72">evidence you can ever share.</text>

    <!-- Anchors the lower third. Add a name or date beneath it if you want one. -->
    <line x1="540" y1="1470" x2="660" y2="1470" stroke="#9A3B26" stroke-width="2"/>

  </g>
</svg>
