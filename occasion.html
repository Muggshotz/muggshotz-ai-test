<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<base href="/">
<title>Muggshotz</title>
<!--
  THE OCCASION SITE (Alyx, 3 Oct 2026). The page a flyer's QR code and a Facebook
  post open: one occasion's products and nothing else -- "We shouldn't route them
  through the generator ... a special site, created just for this flyer, but built
  in a 'plug and play' way which allows us to quickly re-tool it for whatever
  special occasion." This file never changes from one occasion to the next;
  everything that does is occasions/<name>.js. /halloween serves it with
  ?o=halloween (vercel.json); here, ?o= or the last part of the address names it.

  Ordering goes straight to the studio's own order page (order.html, the Stripe
  pipeline), opened over this page as the studio opens it, so its Back comes
  back here. The 3D mug (mug3d.js) and the Magic Mug's demonstration, shelf and
  prices (magic-mug.js) are the studio's own, shared.

  Every view follows the panel checklist (CLAUDE.md): a name, a Back to the view
  before it, pictures, prices, and a landing on the title.
-->
<style>
:root{--bg:#0d0a12;--panel:#17121f;--accent:#ff7a1a;--accent2:#8bd34a;--text:#f3ead8;--muted:#b9a98f}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#page{max-width:980px;margin:0 auto;padding:0 16px 48px}
img{max-width:100%}
button{font:inherit}
.hero{text-align:center;padding:28px 0 8px}
.hero h1{font-size:clamp(34px,7vw,64px);line-height:1.02;margin:0;letter-spacing:.5px;color:var(--text);text-transform:uppercase}
.hero h1 b{color:var(--accent)}
.hero-banner{padding-top:12px}
.hero .banner{display:block;width:100%;height:auto;border-radius:12px;margin:0 0 10px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hero h1 b.big{display:inline-block;font-size:1.45em;line-height:1}
.hero .sub{font-size:clamp(18px,3.4vw,26px);color:var(--accent2);font-weight:800;margin:8px 0 4px}
.hero .by{color:var(--muted);font-size:15px;margin:6px 0 0}
.sec{margin:34px 0 0}
.sec h2,.view h2{font-size:clamp(22px,4vw,30px);margin:0 0 4px;color:var(--accent)}
.sec .line,.view .line{color:var(--muted);font-size:14px;margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:720px){.grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--panel);border:1px solid #2a2236;border-radius:10px;padding:6px;text-align:center;cursor:pointer;color:var(--text)}
.tile:hover{border-color:var(--accent)}
.tile img{display:block;width:100%;height:auto;border-radius:6px;margin-bottom:6px}
.tile .nm{font-size:14px}
.tile .pr{font-size:13px;color:var(--accent2);margin-top:2px}
.card{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid #2a2236;border-radius:12px;padding:12px;cursor:pointer}
.card:hover{border-color:var(--accent)}
.card img{width:120px;height:90px;object-fit:cover;border-radius:8px;flex:none;background:#fff}
.card .tx{flex:1}
.card .nm{font-size:18px;font-weight:700}
.card .ln{font-size:13px;color:var(--muted);margin-top:3px}
.card .pr{font-size:14px;color:var(--accent2);margin-top:4px}
.card .ar{color:var(--accent);font-size:24px}
.cards{display:grid;gap:10px}
.view{padding-top:18px}
.back{background:transparent;border:1px solid #3a2f49;color:var(--text);border-radius:18px;padding:6px 14px;cursor:pointer;margin-bottom:14px}
.back:hover{border-color:var(--accent)}
.big{position:relative;margin:4px 0 12px}
.big img{display:block;width:100%;height:auto;border-radius:10px}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:50%;background:rgba(13,10,18,.85);border:1px solid #3a2f49;color:var(--text);font-size:22px;cursor:pointer}
.arr.l{left:-10px}.arr.r{right:-10px}
.nm-big{text-align:center;font-size:20px;margin:0}
.pr-big{text-align:center;color:var(--accent2);margin:4px 0 14px}
.order{display:block;width:100%;background:linear-gradient(180deg,#ff9a3d,#e0590a);border:0;border-radius:12px;padding:16px;color:#fff;font-size:18px;font-weight:800;cursor:pointer;letter-spacing:.5px}
.order:hover{filter:brightness(1.07)}
.hands{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
.hands button{background:var(--panel);border:1px solid #3a2f49;color:var(--text);border-radius:10px;padding:10px;cursor:pointer}
.hands button.on{border-color:var(--accent);box-shadow:0 0 10px rgba(255,122,26,.5)}
.hands.styles{grid-template-columns:repeat(3,1fr);margin-top:16px}
.hands.styles button{font-weight:600}
.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:40px}
/* The Magic Mug: its demonstration (the heat-up), How it works, and the shelf. */
#smartHowReveal{position:relative;max-width:620px;margin-left:auto!important;margin-right:auto!important;aspect-ratio:4/3;background:#f2f4f7;border-radius:10px;overflow:hidden;cursor:pointer;margin:6px 0 4px}
#smartHowReveal>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#smartHowReveal>.pm-mug3d-stage{position:absolute;inset:0;touch-action:pan-y}
#smartHowReveal>.pm-mug3d-stage canvas{display:block;width:100%;height:100%}
#smartHowRevealWords{min-height:1.4em;text-align:center;color:var(--accent2);font-weight:700;margin:6px 0 2px}
.smart-blink{animation:occBlink 1.1s ease-in-out infinite}
@keyframes occBlink{0%,100%{opacity:1}50%{opacity:.35}}
.replay{display:block;margin:4px auto 0;background:transparent;border:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.pm-step{text-align:center;padding:1.6rem 0 1.4rem;border-top:1px solid #2a2236}
.pm-sn{width:30px;height:30px;border-radius:50%;border:1px solid var(--accent);color:var(--accent);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:14px}
.pm-sh{font-size:18px;margin-bottom:6px}
.pm-sl{color:var(--muted);font-size:14px;line-height:1.5;max-width:420px;margin:0 auto}
.pm-simg{display:block;width:min(100%,300px);height:auto;margin:1.1rem auto 0;border-radius:10px}
.pm-simg.pm-wide{width:100%}
.pm-mug3d{position:relative;width:100%;aspect-ratio:4/3;background:#f2f4f7;border-radius:10px;overflow:hidden;cursor:pointer}
.pm-mug3d>img{display:block;width:100%;height:100%;object-fit:cover}
.pm-mug3d>.pm-mug3d-stage{position:absolute;inset:0;touch-action:pan-y;cursor:grab}
.pm-mug3d>.pm-mug3d-stage canvas{display:block;width:100%;height:100%}
.pm-mug3d.live>img{visibility:hidden}
.pm-spin-cue{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:rgba(11,16,24,.82);color:#fff;font-size:13px;font-weight:600;padding:5px 12px;border-radius:14px;pointer-events:none;white-space:nowrap}
.pm-mug3d.live.spinning .pm-spin-cue,.no3d .pm-spin-cue{display:none}
.mugs{display:grid;gap:22px;margin-top:8px}
@media (min-width:720px){.mugs{grid-template-columns:1fr 1fr}}
.mugname{display:flex;justify-content:space-between;align-items:baseline;margin:8px 2px}
.mugname span{color:var(--accent2);font-size:14px}
.mugname i{font-style:normal;font-size:11px;color:var(--muted);margin-left:8px;border:1px solid #3a2f49;border-radius:9px;padding:1px 7px;vertical-align:middle}
.mugorder{background:transparent;border:1px solid var(--accent);color:var(--text);border-radius:18px;padding:8px 14px;cursor:pointer;width:100%;font-weight:700}
.mugorder:hover{background:rgba(255,122,26,.12)}
.mugadd{background:var(--accent);border:1px solid var(--accent);color:#1a1020;border-radius:18px;padding:8px 14px;cursor:pointer;width:100%;font-weight:800;margin-bottom:6px}
.mugadd.in{background:transparent;color:var(--accent)}
.packhead{text-align:center;margin:6px 0 4px}
.packhead b{display:block;text-transform:uppercase;letter-spacing:.04em;color:var(--accent);font-size:17px}
#packTray{position:sticky;bottom:0;z-index:5;margin:18px -4px 0;padding:10px 12px 12px;background:var(--panel);border:1px solid var(--accent);border-radius:14px 14px 0 0;box-shadow:0 -6px 18px rgba(0,0,0,.45)}
#packTray .line{text-align:center;margin:0 0 8px}
#packTray .picks{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
#packTray .pick{position:relative;flex:0 0 64px;text-align:center;font-size:10px;color:var(--muted)}
#packTray .pick img{width:64px;height:64px;border-radius:8px;display:block}
#packTray .pick button{position:absolute;top:-4px;right:-4px;width:22px;height:22px;border-radius:50%;border:0;background:#000;color:#fff;cursor:pointer;font-size:12px;line-height:22px;padding:0}
#packTray .go{width:100%;margin-top:6px}
/* The order page, opened over this one as the studio opens it. */
#orderPageOverlay{position:fixed;inset:0;z-index:2147483000;background:#0b0f16}
#orderPageOverlay iframe{width:100%;height:100%;border:0;display:block}
html.order-page-open{overflow:hidden}
.missing{text-align:center;padding:80px 0;color:var(--muted)}
/* GOT A BETTER IDEA? the mats' last tile (Alyx, 6-7 Oct 2026) */
.tile.idea{display:flex;flex-direction:column}
.tile.idea .ideabox{aspect-ratio:900/552;border:2px dashed var(--accent);border-radius:6px;margin-bottom:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px}
.tile.idea .ideabox b{font-size:clamp(17px,3.2vw,22px);color:var(--accent)}
.tile.idea .ideabox span{font-size:13px;color:var(--muted)}
.tile.idea.open{grid-column:1/-1;cursor:default;text-align:left;padding:14px;border-color:var(--accent)}
.tile.idea.open h3{margin:0 0 4px;color:var(--accent);font-size:20px}
.tile.idea .hint{font-size:13px;color:var(--muted);margin:0 0 10px}
.tile.idea textarea,.tile.idea input{width:100%;box-sizing:border-box;background:#0f0b15;color:var(--text);border:1px solid #3a2f4a;border-radius:8px;padding:10px;font:inherit;font-size:16px}
.tile.idea textarea{min-height:92px;resize:vertical}
.tile.idea .go{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#1a0f05;font-weight:800;font-size:16px;cursor:pointer}
.tile.idea .go.alt{background:#2a2236;color:var(--text)}
.tile.idea .err{color:#ff7a6a;font-size:13px;margin-top:8px}
.tile.idea .mine{display:block;width:100%;aspect-ratio:4650/2850;object-fit:cover;border-radius:8px;background:#000}
.tile.idea .spin{width:34px;height:34px;border:4px solid #3a2f4a;border-top-color:var(--accent);border-radius:50%;animation:ideaspin 1s linear infinite;margin:18px auto}
@keyframes ideaspin{to{transform:rotate(360deg)}}
.tile.idea .ideabox.mug{aspect-ratio:960/720}
.tile.idea .mine.band{aspect-ratio:2475/1155}
.tile.idea label.fld{display:block;font-size:13px;color:var(--muted);margin:0 0 8px}
.tile.idea label.fld textarea{margin-top:4px;min-height:64px}
.tile.idea .note{font-size:13px;color:var(--muted);margin:6px 0 8px}
.tile.idea .consignrow{display:flex;gap:8px;align-items:center;margin-top:10px}
.tile.idea .consignrow .go{margin-top:0;flex:1}
.tile.idea .info{flex:0 0 38px;height:38px;border-radius:50%;border:1px solid var(--accent);background:transparent;color:var(--accent);font:700 17px Georgia,serif;cursor:pointer}
.tile.idea label.tick{display:flex;gap:10px;align-items:flex-start;font-size:14px;margin:10px 0 2px;cursor:pointer}
.tile.idea label.tick input{width:auto;margin:3px 0 0;flex:0 0 auto}
.tile.idea .fld input{margin-top:4px}
#ideaInfo{position:fixed;inset:0;z-index:2147483001;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:16px}
#ideaInfo .box{background:var(--panel);border:1px solid var(--accent);border-radius:14px;max-width:520px;max-height:90vh;overflow:auto;padding:18px 18px 14px;font-size:15px;line-height:1.5}
#ideaInfo h3{margin:0 0 8px;color:var(--accent);font-size:20px}
#ideaInfo p{margin:0 0 10px}
#ideaInfo .go{display:block;width:100%;padding:12px;border:0;border-radius:10px;background:var(--accent);color:#1a0f05;font-weight:800;font-size:16px;cursor:pointer}
</style>
<script src="mug3d.js"></script>
<script src="magic-mug.js"></script>
<script src="count-visit.js"></script>

<body>
<div id="page"><div id="occRoot"><div class="missing">Loading…</div></div></div>
<script type="module">
import { PRODUCTS_CATALOG } from './lib/products-catalog.js';

const $ = n => '$' + Number(n).toFixed(2);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const root = document.getElementById('occRoot');

// WHICH OCCASION: ?o=halloween, or /halloween (vercel.json serves this page there).
function occasionName() {
  const q = new URLSearchParams(location.search).get('o');
  const last = location.pathname.split('/').filter(Boolean).pop() || '';
  const name = (q || (last.endsWith('.html') ? '' : last)).toLowerCase();
  return /^[a-z0-9-]{2,40}$/.test(name) ? name : '';
}
function loadOccasion(name) {
  return new Promise((resolve, reject) => {
    const s = document.createElement('script');
    s.src = 'occasions/' + name + '.js?v=' + Date.now();
    s.onload = () => window.OCCASION ? resolve(window.OCCASION) : reject(new Error('no OCCASION'));
    s.onerror = () => reject(new Error('no occasion file'));
    document.head.appendChild(s);
  });
}

// A FLYER'S CODE (start.html's rule): kept for the order page, which fills it in.
(function rememberReferral() {
  try {
    const ref = (new URLSearchParams(location.search).get('ref') || '').trim().toUpperCase();
    if (/^[A-Z0-9]{3,16}-[A-Z]?\d{2}$/.test(ref)) localStorage.setItem('muggshotz_referral_code', ref);
  } catch (e) {}
})();

// WHERE THEY CAME FROM (Alyx, 3 Oct 2026: which orders came from the flyers,
// which from Facebook). The QR codes differ only in ?from= (flyer, facebook);
// it is kept per occasion, so someone who scans the flyer and comes back later
// by typing the address still counts as the flyer's. Every order from here
// carries the occasion, and the from when there is one: "halloween/flyer".
const OCC_FROM_KEY = 'mz_occasion_from';
function occasionFrom(key) {
  let from = '';
  try {
    from = (new URLSearchParams(location.search).get('from') || '').trim().toLowerCase().replace(/[^a-z0-9-]/g, '').slice(0, 24);
    const kept = JSON.parse(localStorage.getItem(OCC_FROM_KEY) || '{}');
    if (from) { kept[key] = from; localStorage.setItem(OCC_FROM_KEY, JSON.stringify(kept)); }
    else from = kept[key] || '';
  } catch (e) {}
  return from;
}

// The studio's device id, so an order from here is the same customer's.
function deviceId() {
  try {
    let d = localStorage.getItem('muggshotz_device_id');
    if (!d) { d = 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2, 10); localStorage.setItem('muggshotz_device_id', d); }
    return d;
  } catch (e) { return 'dev-' + Date.now(); }
}

function price(catalogKey, size) {
  const p = PRODUCTS_CATALOG[catalogKey];
  return p && p.sizes && p.sizes[size] ? p.sizes[size].price : null;
}

let O = null;                 // the occasion
let view = { name: 'home' };  // home | mat | magic | more
let hand = 'right';           // the Magic Mug's hand
let frame = 'none';           // the Magic Mug's frame: 'none', or one its designs come in
let decal = false;            // Decal or no decal (Alyx, 7 Oct 2026): the decal version where a design has one
let packPicks = [];          // the haunted 4-pack being built: design keys, '~one' when framed
let mugStyle = null;          // the Magic Mugs' tab (magic-mug.js setStyles); null is the first, Story / Joke
let moreIndex = 0;

// ---- views -----------------------------------------------------------------
function heroHtml() {
  // headlineBig, when given, is a second line in the big accent letters;
  // otherwise the headline's last word is.
  const h = O.headlineBig ? esc(O.headline) + '<br><b class="big">' + esc(O.headlineBig) + '</b>'
    : esc(O.headline).replace(/(\S+)\.?$/, '<b>$&</b>');
  // banner, when given, is the artist's picture of the headline (Bud's, for
  // Halloween): it is shown, and the words stay in the h1 for screen readers.
  if (O.banner) return '<div class="hero hero-banner"><img class="banner" src="' + O.banner + '" alt="' + esc(O.headline + ' ' + (O.headlineBig || '')) + '"/>'
    + '<h1 class="sr">' + h + '</h1><div class="sub">' + esc(O.subline || '') + '</div>'
    + (O.orderBy ? '<p class="by">' + esc(O.orderBy) + '</p>' : '') + '</div>';
  return '<div class="hero"><h1>' + h + '</h1><div class="sub">' + esc(O.subline || '') + '</div>'
    + (O.orderBy ? '<p class="by">' + esc(O.orderBy) + '</p>' : '') + '</div>';
}
function featuredPrice() { return price(O.featured.catalog, O.featured.size); }
function moreShown() { return (O.more || []).filter(m => m.designs && m.designs.length).slice(0, 4); }
function moreFrom(m) { return price(m.catalog, m.size); }

function homeHtml() {
  const F = O.featured, fp = featuredPrice();
  let h = heroHtml();
  h += '<section class="sec" id="secFeatured"><h2>' + esc(F.title) + ' · ' + $(fp) + '</h2><p class="line">' + esc(F.line) + ' · tap one to see it big</p><div class="grid">'
    + F.designs.map((d, i) => '<div class="tile" data-mat="' + d.key + '" onclick="occGo(\'mat\',' + i + ')"><img src="' + F.dir + '/show/' + d.key + '.jpg" width="' + F.show[0] + '" height="' + F.show[1] + '" alt="" loading="' + (i < 6 ? 'eager' : 'lazy') + '"/><div class="nm">' + esc(d.label) + '</div><div class="pr">' + $(fp) + '</div></div>').join('')
    + ideaTileHtml('mat')
    + '</div></section>';
  const M = O.magicMugs, set = M && typeof SURPRISE_SETS !== 'undefined' && SURPRISE_SETS[M.set];
  if (set && set.designs.length) {
    h += '<section class="sec" id="secMagic"><h2>' + esc(M.title) + '</h2><p class="line">' + esc(M.line) + '</p>'
      + '<div class="card" onclick="occGo(\'magic\')"><img src="art/surprise/mug/' + set.designs[0].file + '.jpg" alt=""/><div class="tx"><div class="nm">See how they work</div><div class="ln">' + (setStyles(set).length ? setStyles(set).map(s => esc(s.label) + ' (' + set.designs.filter(d => d.style === s.key).length + ')').join(' · ') : set.designs.map(d => esc(d.label)).join(', ')) + '</div><div class="pr">' + $(SMART_MUG_PRICE) + ' each</div></div><div class="ar">›</div></div></section>';
  }
  const more = moreShown();
  if (more.length) {
    h += '<section class="sec" id="secMore"><h2>' + esc(O.moreTitle) + '</h2><p class="line">Tap one to see its designs</p><div class="cards">'
      + more.map(m => '<div class="card" data-more="' + m.key + '" onclick="occGo(\'more\',\'' + m.key + '\')"><img src="' + m.pic + '" alt=""/><div class="tx"><div class="nm">' + esc(m.title) + '</div><div class="ln">' + esc(m.line) + '</div><div class="pr">from ' + $(moreFrom(m)) + '</div></div><div class="ar">›</div></div>').join('')
      + '</div></section>';
  }
  return h + '<div class="foot">MUGGSHOTZ · ' + esc(O.title) + '</div>';
}

function matHtml(i) {
  const F = O.featured, d = F.designs[i], fp = featuredPrice();
  return '<div class="view" id="viewMat"><button class="back" onclick="occBack()">← All the mats</button>'
    + '<h2 id="viewTitle">' + esc(F.title) + '</h2><p class="line">' + (i + 1) + ' of ' + F.designs.length + '</p>'
    + '<div class="big"><img id="matPic" src="' + F.dir + '/show/' + d.key + '.jpg" width="' + F.show[0] + '" height="' + F.show[1] + '" alt="' + esc(d.label) + '"/>'
    + '<button class="arr l" aria-label="Previous" onclick="occStep(-1)">‹</button><button class="arr r" aria-label="Next" onclick="occStep(1)">›</button></div>'
    + '<p class="nm-big">' + esc(d.label) + '</p><p class="pr-big">' + esc(F.line) + ' · ' + $(fp) + '</p>'
    + '<button class="order" id="orderBtn" onclick="occOrderMat()">Order this mat · ' + $(fp) + '</button></div>';
}

// THE FRAME (Alyx, 3 Oct 2026: the Halloween frame "offered to all"): a choice
// over the mugs, like the hand, offered when the holiday's mugs come in one.
function frameChoices(set) { const f = [...new Set(styleDesigns(set, mugStyle).flatMap(d => designFrames(d)))]; return f.length ? ['none'].concat(f) : []; }
function mugFile(d) { return designShown(d, decal) + (frame !== 'none' && designFrames(d).includes(frame) ? '-' + frame : ''); }
// The key a design goes into the 4-pack or the order as: its decal version when that is chosen, else its frame when one is.
function mugKey(d) { return decal && d.decal ? d.key + '~decal' : frame !== 'none' && designFrames(d).includes(frame) ? d.key + '~' + frame : d.key; }
function decalChoiceHtml(set) {
  if (!styleDesigns(set, mugStyle).some(d => d.decal)) return '';
  return '<p class="line" style="margin-top:4px">Decal, or no decal? Two looks for the same joke.</p><div class="hands decals">'
    + '<button data-decal="0" class="' + (decal ? '' : 'on') + '" onclick="occDecal(false)">No decal · the whole picture</button>'
    + '<button data-decal="1" class="' + (decal ? 'on' : '') + '" onclick="occDecal(true)">Decal · two stickers on white</button></div>';
}
function frameChoiceHtml(set) {
  const fs = frameChoices(set); if (!fs.length) return '';

// ---- moving between views ----------------------------------------------------
// Forward and Back are the same list of views, reversed (the panel checklist).
// Each view is a history entry, so the phone's own back button agrees.
function release() {
  try { if (typeof releaseHowReveal === 'function') releaseHowReveal(); } catch (e) {}
  try { if (typeof releaseShelfMug === 'function') releaseShelfMug(); } catch (e) {}
  try { if (typeof MUG3D !== 'undefined' && MUG3D.mounted()) MUG3D.close(); } catch (e) {}
}
function render(from) {
  release();
  if (view.name === 'mat') root.innerHTML = matHtml(view.i);
  else if (view.name === 'magic') root.innerHTML = magicHtml();
  else if (view.name === 'more') root.innerHTML = moreHtml(view.key);
  else root.innerHTML = homeHtml();
  land(from);
}
// THE LANDING: a view lands at its title; Home, come back to, lands on the
// section left (the mat itself, for a mat).
function land(from) {
  requestAnimationFrame(() => {
    let el = null;
    if (view.name !== 'home') el = document.querySelector('.view');
    else if (from && from.name === 'mat') el = document.querySelector('.tile[data-mat="' + O.featured.designs[from.i].key + '"]');
    else if (from && from.name === 'magic') el = document.getElementById('secMagic');
    else if (from && from.name === 'more') el = document.getElementById('secMore');
    if (el) el.scrollIntoView({ block: view.name === 'home' && from && from.name === 'mat' ? 'center' : 'start' });
    else window.scrollTo(0, 0);
    if (view.name === 'magic') setTimeout(() => { if (view.name === 'magic') occPlayDemo(); }, 300);
    if (view.name === 'more') { const mm = document.getElementById('moreMug'); if (mm) occSpinMore(mm); }
  });
}
function go(next) {
  const from = view; view = next;
  try { history.pushState({ occ: next }, '', location.href); } catch (e) {}
  render(from);
}
window.occGo = (name, arg) => {
  if (name === 'mat') go({ name: 'mat', i: arg });
  else if (name === 'more') { moreIndex = 0; go({ name: 'more', key: arg }); }
  else go({ name });
};
window.occBack = () => { history.back(); };
window.addEventListener('popstate', e => {
  if (document.documentElement.classList.contains('order-page-open')) { closeOrderPage(true); return; }
  const from = view; view = (e.state && e.state.occ) || { name: 'home' };
  render(from);
});
window.occStep = d => {
  const n = O.featured.designs.length; const i = ((view.i + d) % n + n) % n;
  view = { name: 'mat', i }; try { history.replaceState({ occ: view }, '', location.href); } catch (e) {}
  root.innerHTML = matHtml(i);
};
window.occMoreStep = d => {
  const m = O.more.find(x => x.key === view.key), n = m.designs.length;
  moreIndex = ((moreIndex + d) % n + n) % n; release(); root.innerHTML = moreHtml(view.key);
  const mm = document.getElementById('moreMug'); if (mm) occSpinMore(mm);
};

// ---- the Magic Mug ---------------------------------------------------------------

window.occFrame = f => {

// A coffee mug turns on the studio's own 3D mug: Classic White, the design all round.
window.occSpinMore = el => {
  if (!el || typeof MUG3D === 'undefined' || (typeof mug3dFailed !== 'undefined' && mug3dFailed)) return;
  if (!el._cue) { el._cue = true; el.addEventListener('mug3dspin', e => el.classList.toggle('spinning', !!e.detail)); }
  MUG3D.open(el.querySelector('.pm-mug3d-stage'), { sizeLabel: '11oz', styleName: 'Classic White', colorHex: '#ffffff', panoramaUrl: el.dataset.wrap, panelUrls: [], startAngle: -90, spinStep: 0.6, restartOnView: true, turns: 1 })
    .then(() => el.classList.add('live'))
    .catch(err => { console.error('The mug could not turn; its picture stands in:', err); document.getElementById('page').classList.add('no3d'); });
};

// ---- GOT A BETTER IDEA? ------------------------------------------------------
// (Alyx, 6-7 Oct 2026) The last tile of each product section: the mats', the
// Magic Mugs', and every product line's to come ("comprehensively across all
// product lines"). The visitor describes their own, and the tile turns into
// it, painted as that section's product and nothing else, then they keep it
// (order it) or try another. As far as they can tell it is this flyer's own
// little shop: it never sends them into the studio. Their first two tries are
// free for a confirmed email (the flyer's code in lib/card-bonus.js), drawn
// from the flyer's pool of 300 (lib/free-pool.js); when the pool is closed or
// their tries are used, it offers the token packs, and a pack bought here
// comes back to the box it left. The boxes share the device's tries and each
// keeps its own words and picture.
//   k: 'mat' (the featured product, O.featured.idea) | 'mug' (O.magicMugs.idea)
//   phase: idle | typing | email | waiting | painting | done | out
const ideas = {};
function ideaState(k) { return ideas[k] || (ideas[k] = { k, phase: 'idle', text: '', text2: '', email: '', name: '', url: null, sent: false, err: '', tries: null, verified: false, open: null, poll: null }); }
function ideaCfg(k) { return k === 'mug' ? (O && O.magicMugs && O.magicMugs.idea) : (O && O.featured && O.featured.idea); }
function ideaPrice(k) { return k === 'mug' ? SMART_MUG_PRICE : featuredPrice(); }
// The box's words, by what it paints.
const IDEA_WORDS = {
  mat: { own: 'Your own mat', title: 'Your mat', make: 'Make my mat', painting: 'Painting your mat…', order: 'Order this mat', empty: 'Tell us a little about your mat first.',
    hint: 'Describe your mat. We\'ll paint it as an 18 x 30 in welcome mat. Put any words you want on the mat in quotation marks.' },
  mug: { own: 'Your own Magic Mug', title: 'Your Magic Mug', make: 'Make my Magic Mug', painting: 'Painting your Magic Mug…', order: 'Order this mug', empty: 'Tell us both halves of your joke first.',
    hint: 'A Magic Mug tells its joke in two halves: what they see first, and what they see when they turn the mug. Describe both. Put any words you want on the mug in quotation marks.' }
};
function ideaTileHtml(k) {
  const I = ideaCfg(k); if (!I) return '';
  const S = ideaState(k), W = IDEA_WORDS[k], p = $(ideaPrice(k)), id = 'ideaTile-' + k;
  const on = f => ' onclick="occIdea' + f + '(\'' + k + '\')"';
  if (S.phase === 'idle') {
    return '<div class="tile idea" id="' + id + '"' + on('Open') + '><div class="ideabox ' + k + '"><b>Got a better idea?</b><span>Tap here to enter your idea</span></div>'
      + '<div class="nm">' + W.own + '</div><div class="pr">' + p + '</div></div>';
  }
  const left = typeof S.tries === 'number' && S.tries > 0 ? '<p class="hint">' + (S.tries === 1 ? 'You have 1 try left.' : 'You have ' + S.tries + ' tries left.') + '</p>' : '';
  const err = S.err ? '<div class="err">' + esc(S.err) + '</div>' : '';
  let body = '';
  if (S.phase === 'typing') {
    const fields = k === 'mug'
      ? '<label class="fld">What they see first<textarea id="ideaText-mug" maxlength="400" placeholder="' + esc(I.placeholder.first) + '" oninput="occIdeaType(\'mug\',this.value)">' + esc(S.text) + '</textarea></label>'
        + '<label class="fld">What they see when they turn the mug<textarea id="ideaText2-mug" maxlength="400" placeholder="' + esc(I.placeholder.then) + '" oninput="occIdeaType(\'mug\',this.value,2)">' + esc(S.text2) + '</textarea></label>'
      : '<textarea id="ideaText-' + k + '" maxlength="600" placeholder="' + esc(I.placeholder || '') + '" oninput="occIdeaType(\'' + k + '\',this.value)">' + esc(S.text) + '</textarea>';
    body = '<h3>Got a better idea?</h3><p class="hint">' + W.hint + '</p>' + fields
      + left + '<button class="go"' + on('Go') + '>' + W.make + '</button>' + err;
  } else if (S.phase === 'email') {
    body = '<h3>Your first two are free</h3><p class="hint">Where should we send your key? Tap the link in the email, then come back here: your idea stays right where you left it.</p>'
      + '<input id="ideaEmail-' + k + '" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="' + esc(S.email) + '"/>'
      + '<button class="go"' + on('Email') + '>Send my two free tries</button>'
      + '<button class="go alt"' + on('Back') + '>← Back to my idea</button>' + err;
  } else if (S.phase === 'waiting') {
    body = '<h3>Check your email</h3><p class="hint">We sent a link to <b>' + esc(S.email) + '</b>. Tap it, then come back to this page: it updates by itself, and your ' + (k === 'mug' ? 'mug' : 'mat') + ' starts painting.</p>'
      + '<div class="spin"></div><button class="go alt"' + on('EmailAgain') + '>Use a different email</button>' + err;
  } else if (S.phase === 'painting') {
    body = '<h3>' + W.painting + '</h3><p class="hint">“' + esc(ideaWords(S)) + '”</p><div class="spin"></div><p class="hint" style="text-align:center">About a minute. Keep this page open.</p>';
  } else if (S.phase === 'done') {
    const note = k === 'mug'
      ? '<p class="note">Laid flat, the way it wraps the mug. ' + (hand === 'left' ? 'Printed turned round for the left hand picked above, so the setup still faces them first.' : 'Printed for a right-handed drinker: the setup faces them first. Left-handed? Pick it above and we turn it round.') + '</p>'
      : '';
    body = '<h3>' + W.title + '</h3><img class="mine' + (k === 'mug' ? ' band' : '') + '" src="' + esc(S.url) + '" alt="' + W.title + '"/>' + note + left
      + '<button class="go"' + on('Order') + '>' + W.order + ' · ' + p + '</button>'
      + '<button class="go alt"' + on('Another') + '>Try another idea</button>'
      + (S.sent ? '<p class="note">✓ Submitted for consignment. We\'ll email you.</p>'
        : '<div class="consignrow"><button class="go alt"' + on('Consign') + '>Love it? Get paid for it</button><button class="info" aria-label="How consignment works" onclick="occIdeaInfo()">i</button></div>') + err;
  } else if (S.phase === 'consign') {
    body = '<h3>Get paid for your idea</h3><p class="hint">Submit your ' + (k === 'mug' ? 'mug' : 'mat') + ' for a consignment spot, free. If we take it on, you earn 25% of the net profit on every one sold. <a href="#" onclick="occIdeaInfo();return false" style="color:var(--accent)">How it works</a></p>'
      + '<img class="mine' + (k === 'mug' ? ' band' : '') + '" src="' + esc(S.url) + '" alt=""/>'
      + '<label class="fld">Your name<input id="ideaName-' + k + '" type="text" autocomplete="name" maxlength="80" placeholder="So we know who to pay" value="' + esc(S.name || '') + '"/></label>'
      + '<label class="fld">Your email<input id="ideaEmail-' + k + '" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com" value="' + esc(S.email) + '"/></label>'
      + '<label class="tick"><input id="ideaAgree-' + k + '" type="checkbox"/><span>This idea is my own. If Muggshotz takes it on, Muggshotz may make and sell it, and I\'ll be paid 25% of its net profit as described in <a href="#" onclick="occIdeaInfo();return false" style="color:var(--accent)">How it works</a>.</span></label>'
      + '<button class="go"' + on('Submit') + '>Submit my design</button>'
      + '<button class="go alt"' + on('Done') + '>← Back</button>' + err;
  } else if (S.phase === 'sending') {
    body = '<h3>Sending your design…</h3><div class="spin"></div>';
  } else {
    body = '<h3>' + (S.open === false && !S.verified ? "Today's free tries are all taken" : 'Your free tries are used') + '</h3>'

      + '<button class="go" onclick="occIdeaBuy(\'' + k + '\',\'3tokens\')">3 more tries · $1.33</button>'
      + '<button class="go alt" onclick="occIdeaBuy(\'' + k + '\',\'20tokens\')">20 more tries · $5</button>'
      + (S.text ? '<button class="go alt"' + on('Back') + '>← Back to my idea</button>' : '') + err;
  }
  return '<div class="tile idea open" id="' + id + '">' + body + '</div>';
}
function ideaDraw(k) {
  const el = document.getElementById('ideaTile-' + k); if (!el) return;
  el.outerHTML = ideaTileHtml(k);
}
// Their idea in their words (the order's record), and the painter's version.
function ideaWords(S) { return S.k === 'mug' ? S.text + ' / ' + S.text2 : S.text; }
// A MAGIC MUG IS TWO STICKERS ON WHITE (the decal mugs' own manner, tools/
// surprise/decal-mug.py): the punchline on the left half, the setup on the
// right, so that a right-handed drinker sees the setup first and turns the mug
// to the punchline. One painting, both scenes, never stitched.
function ideaPrompt(S) {
  if (S.k !== 'mug') return S.text;
  return 'Two separate sticker-style scenes side by side on a plain white background, each its own complete picture with white space around it and nothing drawn between or behind them.\n'
    + 'The RIGHT scene is the setup, seen first: ' + S.text + '\n'
    + 'The LEFT scene is the punchline, seen when the mug is turned: ' + S.text2;
}
async function ideaRefresh(k) {
  const I = ideaCfg(k), S = ideaState(k); if (!I) return;
  try {
    const b = await (await fetch('/api/get-balance?deviceId=' + encodeURIComponent(deviceId()), { cache: 'no-store' })).json();
    S.tries = typeof b.tokenBalance === 'number' ? b.tokenBalance : 0;
    S.verified = !!b.emailVerified;
  } catch (e) { console.error('Could not read the tries left:', e); }
  try {
    const c = await (await fetch('/api/get-balance?card=' + encodeURIComponent(I.code), { cache: 'no-store' })).json();
    S.open = !!(c.on && c.open);
  } catch (e) { console.error('Could not read the free tries:', e); }
}
window.occIdeaType = (k, v, which) => { const S = ideaState(k); if (which === 2) S.text2 = v; else S.text = v; };
window.occIdeaOpen = async k => {
  const S = ideaState(k);
  S.phase = 'typing'; S.err = ''; ideaDraw(k);
  const t = document.getElementById('ideaText-' + k); if (t) t.focus();
  // Read quietly: redrawing now would pull the box out from under their typing.
  await ideaRefresh(k);
};
window.occIdeaBack = k => { const S = ideaState(k); S.phase = 'typing'; S.err = ''; ideaStopPoll(k); ideaDraw(k); };
function ideaReadFields(S) {
  const t = document.getElementById('ideaText-' + S.k); if (t) S.text = t.value;
  const t2 = document.getElementById('ideaText2-' + S.k); if (t2) S.text2 = t2.value;
  S.text = S.text.trim(); S.text2 = S.text2.trim();
}
window.occIdeaGo = async k => {
  const S = ideaState(k); ideaReadFields(S); S.err = '';
  if (S.text.length < 3 || (k === 'mug' && S.text2.length < 3)) { S.err = IDEA_WORDS[k].empty; ideaDraw(k); return; }
  if (S.tries == null) await ideaRefresh(k);
  if (S.tries > 0) return ideaPaint(k);
  if (!S.verified && S.open) { S.phase = 'email'; ideaDraw(k); return; }
  S.phase = 'out'; ideaDraw(k);
};
window.occIdeaEmail = async k => {
  const I = ideaCfg(k), S = ideaState(k), el = document.getElementById('ideaEmail-' + k);
  S.email = (el ? el.value : S.email).trim(); S.err = '';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email)) { S.err = 'That email doesn\'t look right.'; ideaDraw(k); return; }
  try {
    const r = await fetch('/api/send-verification', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email: S.email, deviceId: deviceId(), cardCode: I.code }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) {
      if (d.closed) { S.open = false; S.phase = 'out'; ideaDraw(k); return; }
      if (/already/i.test(d.error || '')) { S.verified = true; S.phase = 'out'; S.err = d.error; ideaDraw(k); return; }
      // Resend's own reason, when the server passed it on (api/send-verification detail).
      let why = ''; try { why = JSON.parse(d.detail || '{}').message || ''; } catch (e) { why = String(d.detail || '').slice(0, 200); }
      throw new Error((d.error || 'Could not send the email.') + (why ? ' (' + why + ')' : ''));
    }
    S.phase = 'waiting'; ideaDraw(k); ideaStartPoll(k);

};
window.occIdeaEmailAgain = k => { const S = ideaState(k); ideaStopPoll(k); S.phase = 'email'; S.err = ''; ideaDraw(k); };
function ideaStopPoll(k) { const S = ideaState(k); if (S.poll) { clearInterval(S.poll); S.poll = null; } }
function ideaStartPoll(k) {
  ideaStopPoll(k);
  const S = ideaState(k);
  S.poll = setInterval(async () => {
    await ideaRefresh(k);
    if (S.tries > 0 && S.phase === 'waiting') { ideaStopPoll(k); ideaPaint(k); }
  }, 4000);
}
async function ideaPaint(k) {
  const I = ideaCfg(k), S = ideaState(k);
  S.phase = 'painting'; S.err = ''; ideaDraw(k);
  const ac = new AbortController(), timer = setTimeout(() => ac.abort(), 240000);
  try {
    const r = await fetch('/api/generate', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ac.signal,
      // The studio's described-design lane (api/generate.js action textOnly):
      // the visitor's own words, the product's rule and its shape, nothing
      // else. A mat is nearly the canvas's own shape and fills it (no ratio);
      // a Magic Mug's wrap is told as bandRatio and painted as a strip across
      // the middle, cut out by ideaMugBand for the print.
      body: JSON.stringify(Object.assign({ action: 'textOnly', prompt: ideaPrompt(S), deviceId: deviceId(), size: I.size, shapingRule: I.rule }, I.ratio ? { bandRatio: I.ratio } : {}))
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.imageUrl) throw new Error(d.error || 'Your ' + (k === 'mug' ? 'mug' : 'mat') + ' could not be painted. Your try was not used; please try again.');
    S.url = d.imageUrl; S.phase = 'done'; S.sent = false;
    if (typeof S.tries === 'number') S.tries = Math.max(0, S.tries - 1);
  } catch (e) {
    S.phase = 'typing';
    S.err = e.name === 'AbortError' ? 'That took too long. Please try again.' : e.message;
  } finally { clearTimeout(timer); }
  ideaDraw(k);
  ideaRefresh(k).then(() => { if (S.phase === 'done') ideaDraw(k); });
}
window.occIdeaAnother = k => { const S = ideaState(k); S.phase = 'typing'; S.err = ''; ideaDraw(k); const t = document.getElementById('ideaText-' + k); if (t) t.focus(); };
// THE PRINT, FROM THE PAINTING. The painter's widest canvas is 3:2 and a Magic
// Mug's wrap is 2475 x 1155 (2.14:1), so the lane paints the wrap as a strip
// across the middle of the canvas with white above and below (api/generate.js
// textOnly, bandRatio). This finds the strip (the rows with anything but white
// in them), cuts the wrap's own shape around its middle and, for a left hand,
// swaps the halves so the setup still faces the drinker. The order server
// prints a single image contained on white (api/create-printify-order.js
// buildSingleImage), so the band has to be the print's own shape before it goes.
async function ideaMugBand(url, forHand) {
  const img = await new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => rej(new Error('the picture could not be read')); i.src = url; });
  const W = img.naturalWidth, H = img.naturalHeight, PW = 2475, PH = 1155;
  const probe = document.createElement('canvas'); probe.width = W; probe.height = H;
  const px = probe.getContext('2d'); px.drawImage(img, 0, 0);
  const data = px.getImageData(0, 0, W, H).data;
  let top = -1, bottom = -1;
  for (let y = 0; y < H; y++) {
    let ink = false;
    for (let x = 0; x < W; x += 2) { const i = (y * W + x) * 4; if (data[i] < 235 || data[i + 1] < 235 || data[i + 2] < 235) { ink = true; break; } }
    if (ink) { if (top < 0) top = y; bottom = y; }
  }
  if (top < 0) { top = 0; bottom = H - 1; }
  const bh = Math.min(H, Math.round(W * PH / PW));
  let y0 = Math.round((top + bottom + 1) / 2 - bh / 2); y0 = Math.max(0, Math.min(H - bh, y0));
  const out = document.createElement('canvas'); out.width = PW; out.height = PH;
  const cx = out.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, PW, PH);
  const half = W / 2;
  if (forHand === 'left') { cx.drawImage(img, half, y0, half, bh, 0, 0, PW / 2, PH); cx.drawImage(img, 0, y0, half, bh, PW / 2, 0, PW / 2, PH); }
  else cx.drawImage(img, 0, y0, W, bh, 0, 0, PW, PH);
  return out.toDataURL('image/jpeg', 0.92);
}
window.occIdeaOrder = async k => {
  const S = ideaState(k); if (!S.url) return;
  if (k === 'mug') {
    S.err = '';
    let band;
    try { band = await ideaMugBand(S.url, hand); }
    catch (e) { S.err = 'Your mug\'s print could not be prepared (' + e.message + '). Please try again.'; ideaDraw(k); return; }
    hand_off({ placements: { left: band, front: null, right: null }, productIcon: 'smart mug', preselectedSurpriseHand: hand, ideaPrompt: ideaWords(S), ideaLabel: IDEA_WORDS.mug.own });
    return;
  }
  const F = O.featured;
  // Printed as the mat's full bleed: the order server covers the print with it,
  // centred, which is exactly the crop the tile shows.
  hand_off(Object.assign({ placements: { left: S.url, front: null, right: null }, ideaPrompt: S.text }, F.order));
};
// CONSIGNMENT (Alyx, 6-7 Oct 2026: "they can actually get paid for their
// creations"). A visitor who loves their design submits it, free, for a
// consignment spot: their name and email (how they get paid), a tick that it
// is their own, and the design itself as a picture, through the pitch system
// (api/admin.js action pitch, kind consign), which keeps it, emails Alyx and
// rings his phone; he takes it on or passes on the admin page. The terms are
// in the (i) panel: 25% of the net profit on every one sold, from the day it
// goes on sale until a year after the day after the flyer's event
// (O.consign.until), or for a year from commission on a page with no event.
window.occIdeaConsign = k => { const S = ideaState(k); S.phase = 'consign'; S.err = ''; ideaDraw(k); const t = document.getElementById('ideaName-' + k); if (t && !t.value) t.focus(); };
window.occIdeaDone = k => { const S = ideaState(k); S.phase = 'done'; S.err = ''; ideaDraw(k); };
// The design as a JPEG for the record: the mug's cut print, the mat's painting.
async function ideaDesignJpeg(S) {
  if (S.k === 'mug') return ideaMugBand(S.url, hand);
  const img = await new Promise((res, rej) => { const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = () => rej(new Error('the picture could not be read')); i.src = S.url; });
  const c = document.createElement('canvas'); c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return c.toDataURL('image/jpeg', 0.9);
}
window.occIdeaSubmit = async k => {
  const S = ideaState(k), name = document.getElementById('ideaName-' + k), email = document.getElementById('ideaEmail-' + k), agree = document.getElementById('ideaAgree-' + k);
  S.name = (name ? name.value : S.name).trim(); S.email = (email ? email.value : S.email).trim(); S.err = '';
  if (S.name.length < 2) { S.err = 'Please give your name, so we know who to pay.'; ideaDraw(k); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(S.email)) { S.err = 'That email doesn\'t look right.'; ideaDraw(k); return; }
  if (!agree || !agree.checked) { S.err = 'Please tick the box to submit your design.'; ideaDraw(k); return; }
  S.phase = 'sending'; ideaDraw(k);
  try {
    const image = await ideaDesignJpeg(S);
    const r = await fetch('/api/admin', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({
      action: 'pitch', kind: 'consign', text: ideaWords(S), name: S.name, email: S.email, agree: true, deviceId: deviceId(), image,
      context: { occasion: O.key, product: k === 'mug' ? 'Magic Mug' : (O.featured.title || 'mat'), hand: k === 'mug' ? hand : '', page: location.href }
    }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'That did not go through. Please try again.');
    S.sent = true; S.phase = 'done';
  } catch (e) { S.phase = 'consign'; S.err = e.message; }
  ideaDraw(k);
};

    : 'Your design earns for <b>one year</b> from the day it goes on sale.';

window.occIdeaBuy = async (k, packId) => {
  const I = ideaCfg(k), S = ideaState(k); S.err = '';
  try {
    const r = await fetch('/api/create-checkout-session', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'token_purchase', deviceId: deviceId(), packId, returnTo: I.page }) });
    const d = await r.json();
    if (!r.ok || !d.url) throw new Error(d.error || 'Could not open checkout.');
    try { sessionStorage.setItem('mz_idea_box', k); sessionStorage.setItem('mz_idea_text', S.text); sessionStorage.setItem('mz_idea_text2', S.text2); } catch (e) {}
    location.href = d.url;
  } catch (e) { S.err = e.message; ideaDraw(k); }
};
// Back from buying tries (?tries=bought): the box they left opens again with
// their idea; the mug's box is in the Magic Mugs view, so that view opens first.
function ideaOnArrival() {
  let back = false, k = 'mat';
  try { back = new URLSearchParams(location.search).get('tries') === 'bought'; k = sessionStorage.getItem('mz_idea_box') || 'mat'; } catch (e) {}
  if (!back || !ideaCfg(k)) return;
  const S = ideaState(k);
  try { S.text = sessionStorage.getItem('mz_idea_text') || ''; S.text2 = sessionStorage.getItem('mz_idea_text2') || ''; } catch (e) {}
  S.phase = 'typing';
  if (k === 'mug') go({ name: 'magic' }); else ideaDraw(k);
  setTimeout(() => { const t = document.getElementById('ideaTile-' + k); if (t) t.scrollIntoView({ block: 'start' }); }, k === 'mug' ? 450 : 0);
  // The purchase lands by webhook a moment after the return; read until it shows.
  let n = 0; const tick = setInterval(async () => { await ideaRefresh(k); if (S.tries > 0 || ++n > 15) clearInterval(tick); }, 3000);
}

// ---- ordering: straight to the order page, never the studio ----------------------
function abs(u) { return /^https?:/.test(u) ? u : location.origin + '/' + u.replace(/^\//, ''); }
function hand_off(pending) {
  pending.deviceId = deviceId();
  pending.occasion = O.key;
  const from = occasionFrom(O.key);
  pending.source = O.key + (from ? '/' + from : '');
  localStorage.setItem('muggshotz_pending_order', JSON.stringify(pending));
  openOrderPage();
}
window.occOrderMat = () => {
  const F = O.featured, d = F.designs[view.i];
  hand_off(Object.assign({ placements: { left: abs(F.dir + '/print/' + d.key + '.jpg'), front: null, right: null }, premadeItem: 'welcome-mats/' + d.key }, F.order));
};
window.occAdd = key => {
  const d = SURPRISE_SETS[O.magicMugs.set].designs.find(x => x.key === key); if (!d || packPicks.length >= 24) return;
  packPicks.push(mugKey(d));
  refreshTray();
};
window.occRemove = i => { packPicks.splice(i, 1); refreshTray(); };
window.occOrderPack = () => {
  if (!packPicks.length) return;
  const set = O.magicMugs.set, urls = setPrintUrls(set, hand, packPicks);
  if (!urls || !urls.length) return;
  hand_off({ placements: { left: urls[0], front: null, right: null }, productIcon: 'smart mug', surpriseSet: set, surpriseMugs: packPicks.slice(), surpriseSetPrints: urls, preselectedSurpriseHand: hand });
};
window.occOrderMagic = key => {
  const set = O.magicMugs.set, d = SURPRISE_SETS[set].designs.find(x => x.key === key);
  if (d) key = mugKey(d);
  const urls = setPrintUrls(set, hand, [key]);
  if (!urls || !urls.length) return;
  hand_off({ placements: { left: urls[0], front: null, right: null }, productIcon: 'smart mug', surpriseSet: set, surpriseMugs: [key], surpriseSetPrints: urls, preselectedSurpriseHand: hand });
};
window.occOrderMore = () => {
  const m = O.more.find(x => x.key === view.key), d = m.designs[moreIndex] || m.designs[0], url = abs(d.file);
  const pending = { placements: { left: url, front: null, right: null } };
  if (m.kind === 'mug') Object.assign(pending, { productIcon: 'mug', mugPrintMode: 'wraparound', panoramaImage: url, preselectedMugStyle: 'Classic White', preselectedMugSize: m.size || '11oz' });
  else if (m.kind === 'coaster') Object.assign(pending, { productIcon: 'coaster', coasterShape: m.shape === 'round' ? 'round' : 'square' });
  else if (m.kind === 'placemat') Object.assign(pending, { productIcon: 'placemat', preselectedPlacemat: m.placemat || 'Neoprene', preselectedPlacematPack: 1 });
  hand_off(pending);
};

// The order page over this one, as the studio opens it (needles-studio.html,
// openOrderPage): its Back closes it and lands back here.
function openOrderPage() {
  let ov = document.getElementById('orderPageOverlay'); if (ov) ov.remove();
  ov = document.createElement('div'); ov.id = 'orderPageOverlay';
  ov.innerHTML = '<iframe id="orderPageFrame" title="Your order" src="order.html?embedded=1"></iframe>';
  document.body.appendChild(ov);
  document.documentElement.classList.add('order-page-open');
  try { history.pushState({ occ: view, orderPage: 1 }, '', location.href); } catch (e) {}
}
function closeOrderPage(fromHistory) {
  const ov = document.getElementById('orderPageOverlay'); if (ov) ov.remove();
  document.documentElement.classList.remove('order-page-open');
  if (!fromHistory) { try { history.back(); } catch (e) {} }
}
window.closeOrderOverlay = () => closeOrderPage(false);

// THE NEWEST VERSION, WITHOUT ASKING (Alyx, 3 Oct 2026: "Make sure the
// platform SELF updates when ever you reload it. As we did with the
// generator"). The studio's rule (needles-studio.html, loadNewestIfIdle), for
// a page made of four files: whenever it comes back to the screen it asks the
// server for each file's ETag, and if any has changed since it loaded, and no
// order is open over it, it reloads onto the newest version.
let partsAtLoad = null;
async function partsNow() {
  const files = [location.pathname, 'occasion.html', 'occasions/' + occasionName() + '.js', 'magic-mug.js', 'mug3d.js'];
  try {
    const tags = await Promise.all(files.map(f => fetch(f + (f.includes('?') ? '&' : '?') + 'etag=' + Date.now(), { method: 'HEAD', cache: 'no-store' }).then(r => r.ok ? r.headers.get('etag') : '')));
    return tags.join('|');
  } catch (e) { return null; }
}
async function loadNewestIfIdle() {
  if (document.documentElement.classList.contains('order-page-open')) return;
  const tag = await partsNow(); if (!tag) return;
  if (!partsAtLoad) { partsAtLoad = tag; return; }
  if (tag === partsAtLoad || document.documentElement.classList.contains('order-page-open')) return;
  try { if (sessionStorage.getItem('mz_occ_reload_for') === tag) return; sessionStorage.setItem('mz_occ_reload_for', tag); } catch (e) {}
  location.reload();
}
window.addEventListener('load', () => setTimeout(loadNewestIfIdle, 1500));
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') loadNewestIfIdle(); });
window.addEventListener('pageshow', e => { if (e.persisted) loadNewestIfIdle(); });

// ---- start -------------------------------------------------------------------------
const name = occasionName();
if (!name) { root.innerHTML = '<div class="missing">This page needs an occasion, like /halloween.</div>'; }
else loadOccasion(name).then(o => {
  O = o; document.title = o.title || 'Muggshotz';
  occasionFrom(o.key);   // the flyer's ?from=, kept on arrival, not only at an order
  if (window.mzCountVisit) mzCountVisit(o.key);   // the visitor count (count-visit.js)
  const c = o.colors || {}; for (const k of Object.keys(c)) document.documentElement.style.setProperty('--' + k, c[k]);
  try { history.replaceState({ occ: view }, '', location.href); } catch (e) {}
  render(null);
  ideaOnArrival();
  try { if (typeof MUG3D !== 'undefined') MUG3D.warm(); } catch (e) {}
}).catch(() => { root.innerHTML = '<div class="missing">That occasion isn\'t here. Try <a href="occasion.html?o=halloween" style="color:var(--accent)">Halloween</a>.</div>'; });
