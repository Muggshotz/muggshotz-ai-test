<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Where's my order? · Muggshotz</title>
<!-- WHERE'S MY ORDER? (Alyx, 7 Oct 2026). No account, no password: the email
     they ordered with, a one-tap link to that inbox, and every order placed
     with it, each with its state and tracking read live from the printer
     (api/orders.js, lib/orders-ledger.js). -->
<style>
:root{--bg:#0d0a12;--panel:#17121f;--accent:#ff7a1a;--accent2:#8bd34a;--text:#f3ead8;--muted:#b9a98f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
.wrap{max-width:560px;margin:0 auto;padding:28px 16px 60px}
h1{font-size:clamp(24px,5vw,32px);margin:0 0 6px;color:var(--accent)}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--panel);border:1px solid #2a2236;border-radius:12px;padding:16px;margin:0 0 14px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
input{width:100%;background:#0f0b15;color:var(--text);border:1px solid #3a2f4a;border-radius:8px;padding:12px;font:inherit;font-size:16px}
.go{display:block;width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--accent);color:#1a0f05;font-weight:800;font-size:16px;cursor:pointer}
.msg{margin-top:12px;color:var(--accent2)}
.err{margin-top:12px;color:#ff7a6a}
.order .nm{font-weight:700;font-size:16px}
.order .st{display:inline-block;margin:6px 0;padding:3px 10px;border-radius:12px;font-size:13px;background:#2a2236}
.order .st.shipped,.order .st.delivered{background:#1f3a1f;color:var(--accent2)}
.order .st.attention{background:#3a1f1f;color:#ff9a8a}
.order .ln{color:var(--muted);font-size:13px}
.order a{color:var(--accent)}
.back{display:inline-block;margin-top:18px;color:var(--muted);text-decoration:none;border:1px solid #3a2f49;border-radius:18px;padding:6px 14px}
</style>
</head>
<body>
<div class="wrap" id="root">
  <h1>Where's my order?</h1>
  <p class="sub">No account needed. Type the email you ordered with and we'll send you a link to every order placed with it.</p>
  <div class="card" id="ask">
    <label for="email">Your email</label>
    <input id="email" type="email" inputmode="email" autocomplete="email" placeholder="you@example.com"/>
    <button class="go" id="send" onclick="askLink()">Send me the link</button>
    <div id="note"></div>
  </div>
  <div id="list"></div>
  <a class="back" href="/">← Back to Muggshotz</a>
</div>
<script>
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (n) => '$' + (Number(n) / 100).toFixed(2);
async function askLink() {
  const email = document.getElementById('email').value.trim(), note = document.getElementById('note');
  note.className = ''; note.textContent = '';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { note.className = 'err'; note.textContent = "That email doesn't look right."; return; }
  const btn = document.getElementById('send'); btn.disabled = true;
  try {
    const r = await fetch('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Could not send the link.');
    note.className = 'msg'; note.textContent = 'If any order was placed with ' + email + ', a link is on its way to it. Tap the link in the email to see your orders.';
  } catch (e) { note.className = 'err'; note.textContent = e.message; }
  btn.disabled = false;
}
function when(iso) { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' }); }
function orderHtml(o) {
  const ship = (o.shipments || []).map((s) => s.url
    ? '<div class="ln">' + (s.deliveredAt ? 'Delivered ' + esc(when(s.deliveredAt)) : 'Track it') + ': <a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.carrier || 'the carrier') + (s.number ? ' · ' + esc(s.number) : '') + '</a></div>'
    : (s.carrier || s.number ? '<div class="ln">Shipped with ' + esc([s.carrier, s.number].filter(Boolean).join(' · ')) + '</div>' : '')).join('');
  return '<div class="card order" data-ref="' + esc(o.ref) + '"><div class="nm">' + (o.items || []).map(esc).join('<br>') + '</div>'
    + '<span class="st ' + esc(o.state) + '">' + esc(o.words) + '</span>' + ship
    + '<div class="ln">Ordered ' + esc(when(o.placedAt)) + (typeof o.amountCents === 'number' ? ' · ' + $(o.amountCents) : '') + '</div></div>';
}
async function showOrders(token) {
  const list = document.getElementById('list'), ask = document.getElementById('ask');
  list.innerHTML = '<div class="card">Looking up your orders…</div>';
  try {
    const r = await fetch('/api/orders?t=' + encodeURIComponent(token), { cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.error || 'Could not read your orders.');
    ask.style.display = 'none';
    document.querySelector('.sub').textContent = 'Orders placed with ' + d.email + ', with where each one is right now.';
    list.innerHTML = d.orders.length ? d.orders.map(orderHtml).join('') : '<div class="card">No orders yet with this address.</div>';
  } catch (e) { list.innerHTML = '<div class="card err" style="margin-top:0">' + esc(e.message) + '</div>'; }
}
const t = new URLSearchParams(location.search).get('t');
if (t) showOrders(t);
</script>
</body>
</html>
