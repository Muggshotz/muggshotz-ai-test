<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MuggsHotz Checkout</title>
</head>
<body>
  <script>
    // Device sticky-note: same ID system used by the generator, so the
    // payment can be matched back to the right customer record.
    function getDeviceId(){
      let id = localStorage.getItem('muggshotz_device_id');
      if(!id){
        id = 'dev-' + Date.now() + '-' + Math.random().toString(36).slice(2,10);
        localStorage.setItem('muggshotz_device_id', id);
      }
      return id;
    }
    const deviceId = getDeviceId();

    fetch('/api/create-checkout-session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ deviceId })
    })
    .then(res => res.json())
    .then(data => {
      if (data.url) {
        window.location.href = data.url;
      } else {
        document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:20%;color:red;">Error: ' + (data.error || 'Unknown error') + '</p>';
      }
    })
    .catch(err => {
      document.body.innerHTML = '<p style="font-family:sans-serif;text-align:center;margin-top:20%;color:red;">Network error: ' + err.message + '</p>';
    });
  </script>
  <p style="font-family:sans-serif;text-align:center;margin-top:20%;">
    Taking you to checkout...
  </p>
</body>
</html>
